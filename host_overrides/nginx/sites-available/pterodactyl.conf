server {

    server_name abcdefghijklmnopqrstuvwxyzdann.gantengdann.my.id _;

    include /etc/nginx/snippets/pteroprotect_server.conf;

    root /var/www/pterodactyl/public;
    index index.html index.htm index.php;
    charset utf-8;

    location / {
        auth_request /__pteroprotect/challenge/check;
        error_page 401 = @pteroprotect_challenge_redirect;
        limit_conn pteroprotect_conn 60;
        limit_req zone=pteroprotect_req burst=40;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log /var/log/nginx/pteroprotect.access.log combined; log_not_found off; }
    location = /robots.txt  { access_log /var/log/nginx/pteroprotect.access.log combined; log_not_found off; }

    access_log /var/log/nginx/pteroprotect.access.log combined;
    error_log  /var/log/nginx/pterodactyl.app-error.log error;

    # allow larger file uploads and longer script runtimes
    client_max_body_size 100m;
    client_body_timeout 120s;

    sendfile off;

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size=100M";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }

    listen [::]:443 ssl default_server ipv6only=on; # managed by Certbot
    listen 443 ssl default_server; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/abcdefghijklmnopqrstuvwxyzdann.gantengdann.my.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/abcdefghijklmnopqrstuvwxyzdann.gantengdann.my.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
