server {
    server_name _;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    include /etc/nginx/snippets/pteroprotect_server.conf;

    root /var/www/pterodactyl/public;
    index index.html index.htm index.php;
    charset utf-8;

    location = /admin/protect/terminal/sessions {
        limit_conn pteroprotect_conn 20;
        limit_req zone=pteroprotect_auth burst=30 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /admin/protect/terminal/sessions/ {
        if ($request_method != GET) { return 405; }
        if ($http_upgrade !~* "^websocket$") { return 426; }
        modsecurity off;
        limit_conn pteroprotect_conn 8;
        limit_req zone=pteroprotect_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:18445;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/client/servers/.+/websocket$ {
        limit_conn pteroprotect_conn 40;
        limit_conn pteroprotect_ws_global_conn 1600;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        auth_request /__pteroprotect/challenge/check_web;
        error_page 401 = @pteroprotect_challenge_redirect;
        limit_conn pteroprotect_conn 120;
        limit_req zone=pteroprotect_req burst=180;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log /var/log/nginx/pteroprotect.access.log combined; log_not_found off; }
    location = /robots.txt  { access_log /var/log/nginx/pteroprotect.access.log combined; log_not_found off; }

    access_log /var/log/nginx/pteroprotect.access.log combined;
    error_log  /var/log/nginx/pterodactyl.app-error.log error;

    # allow larger file uploads and longer script runtimes
    client_max_body_size 25m;
    client_body_timeout 10s;

    sendfile off;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size=100M";
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }

    listen [::]:443 ssl default_server ipv6only=on; # managed by Certbot
    listen 443 ssl default_server; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/$ssl_server_name/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
