# PteroProtect host-level HTTP hardening + offline challenge gate.
server_tokens off;
add_header X-Origin-IP "unknown" always;
set $pteroprotect_challenge_upstream "127.0.0.1:18444";
set $pteroprotect_sqli_probe 0;
modsecurity on;
modsecurity_rules_file /etc/nginx/modsec/main.conf;

# Drop requests that target origin by literal IP host header.
if ($host ~* "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$") { return 444; }
if ($host ~* "^\\[[0-9a-f:]+\\]$") { return 444; }
# Never behave like an open proxy.
if ($request_method = CONNECT) { return 444; }

# If attacker probes common "what is my origin IP" style paths, return opaque value.
location = /ip { default_type text/plain; return 200 "unknown\n"; }
location = /whoami { default_type text/plain; return 200 "unknown\n"; }
location = /origin-ip { default_type text/plain; return 200 "unknown\n"; }
location = /myip { default_type text/plain; return 200 "unknown\n"; }

limit_conn_status 429;
limit_req_status 429;
error_page 429 = @pteroprotect_waf_ratelimit;
error_page 461 = @pteroprotect_provider_token_required;
error_page 463 = @pteroprotect_provider_web_block;

location @pteroprotect_waf_ratelimit {
    internal;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "15" always;
    add_header X-PteroProtect-Code "PP-WAF-429" always;
    add_header X-PteroProtect-Reason "rate-limit" always;
    return 429 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PteroProtect WAF</title><style>:root{--bg:#0f172a;--card:#111827;--line:#243245;--text:#e5e7eb;--muted:#9ca3af;--accent:#22d3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1000px 500px at 20% 10%,#1f3b58 0,#0f172a 55%);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text)}.card{width:min(92vw,640px);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:0 18px 45px rgba(0,0,0,.45)}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(34,211,238,.15);color:#67e8f9;font-weight:700;font-size:12px;letter-spacing:.4px}h1{margin:14px 0 10px;font-size:28px;line-height:1.2}.sub{color:var(--muted);line-height:1.6;margin:0 0 14px}.meta{display:grid;gap:8px;margin:16px 0 4px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(15,23,42,.55)}.k{color:#93c5fd}.v{font-weight:700}button{margin-top:16px;background:var(--accent);color:#082f49;border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.04)}small{display:block;color:#64748b;margin-top:14px}</style></head><body><main class="card"><span class="badge">PteroProtect WAF</span><h1>Terlalu Banyak Request</h1><p class="sub">Sistem proteksi mendeteksi trafik berlebihan dari koneksi ini. Tunggu sebentar, lalu coba lagi.</p><div class="meta"><div class="row"><span class="k">Error Code</span><span class="v">PP-WAF-429</span></div><div class="row"><span class="k">Retry After</span><span class="v"><span id="sec">15</span> detik</span></div></div><button onclick="location.reload()">Coba Lagi</button><small>Jika normal user tapi masih kena limit terus, whitelist IP kamu di PteroProtect.</small></main><script>var s=15;setInterval(function(){s=Math.max(0,s-1);var el=document.getElementById("sec");if(el)el.textContent=String(s);},1000);</script></body></html>';
}

location @pteroprotect_provider_token_required {
    internal;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-PteroProtect-Code "PP-WAF-461" always;
    add_header X-PteroProtect-Reason "provider-token-required" always;
    return 461 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PteroProtect WAF</title><style>:root{--bg:#0f172a;--card:#111827;--line:#243245;--text:#e5e7eb;--muted:#9ca3af;--accent:#22d3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1000px 500px at 20% 10%,#1f3b58 0,#0f172a 55%);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text)}.card{width:min(92vw,640px);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:0 18px 45px rgba(0,0,0,.45)}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(34,211,238,.15);color:#67e8f9;font-weight:700;font-size:12px;letter-spacing:.4px}h1{margin:14px 0 10px;font-size:28px;line-height:1.2}.sub{color:var(--muted);line-height:1.6;margin:0 0 14px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(15,23,42,.55)}.k{color:#93c5fd}.v{font-weight:700}small{display:block;color:#64748b;margin-top:14px}</style></head><body><main class="card"><span class="badge">PteroProtect WAF</span><h1>Token Wajib</h1><p class="sub">Akses dari range provider ini wajib menyertakan token valid pada request API.</p><div class="row"><span class="k">Error Code</span><span class="v">PP-WAF-461</span></div><small>Kirim <code>Authorization: Bearer ...</code> atau token API yang valid.</small></main></body></html>';
}

location @pteroprotect_provider_web_block {
    internal;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-PteroProtect-Code "PP-WAF-463" always;
    add_header X-PteroProtect-Reason "provider-web-blocked" always;
    return 463 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PteroProtect WAF</title><style>:root{--bg:#0f172a;--card:#111827;--line:#243245;--text:#e5e7eb;--muted:#9ca3af;--accent:#22d3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1000px 500px at 20% 10%,#1f3b58 0,#0f172a 55%);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text)}.card{width:min(92vw,640px);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:0 18px 45px rgba(0,0,0,.45)}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(34,211,238,.15);color:#67e8f9;font-weight:700;font-size:12px;letter-spacing:.4px}h1{margin:14px 0 10px;font-size:28px;line-height:1.2}.sub{color:var(--muted);line-height:1.6;margin:0 0 14px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(15,23,42,.55)}.k{color:#93c5fd}.v{font-weight:700}small{display:block;color:#64748b;margin-top:14px}</style></head><body><main class="card"><span class="badge">PteroProtect WAF</span><h1>Akses Web Ditolak</h1><p class="sub">Akses panel/web dari range IP provider diblok. Jalur yang diizinkan hanya API dengan bearer token panel yang valid.</p><div class="row"><span class="k">Error Code</span><span class="v">PP-WAF-463</span></div><small>Gunakan API resmi dengan header <code>Authorization: Bearer ptlc_...</code> atau <code>ptla_...</code>.</small></main></body></html>';
}

keepalive_timeout 20s;
keepalive_requests 100;
send_timeout 15s;
reset_timedout_connection on;
client_body_buffer_size 64k;
large_client_header_buffers 4 8k;
etag on;

# Local CDN static cache lane (safe for immutable/static assets only).
location = /assets/manifest.json {
    expires 1m;
    add_header Cache-Control "public, max-age=60" always;
    access_log off;
    try_files $uri =404;
}

location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, immutable" always;
    access_log off;
    try_files $uri =404;
}

# Allow favicon manifest assets without challenge redirect, so browsers can parse them.
location ^~ /favicons/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# Public user-upload assets (avatars, etc.) must bypass challenge; filenames can be extensionless.
location ^~ /storage/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# Locale payloads are static frontend data and should not trigger challenge loops.
location ^~ /locales/ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri $uri/ /index.php?$query_string;
}

if ($pteroprotect_sqli_probe) {
    return 403;
}

access_log /var/log/nginx/pteroprotect.sqli.log combined if=$pteroprotect_sqli_probe;

location @pteroprotect_challenge_redirect {
    return 302 /__pteroprotect/challenge?rd=$request_uri;
}

# Internal challenge decision endpoint.
location @pteroprotect_challenge_allow {
    internal;
    return 204;
}

location @pteroprotect_challenge_deny {
    internal;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "15" always;
    add_header X-PteroProtect-Code "PP-WAF-503" always;
    return 503;
}

location = /__pteroprotect/challenge/check {
    internal;
    proxy_pass http://$pteroprotect_challenge_upstream/check;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-PteroProtect-Internal 1;
    proxy_set_header X-PteroProtect-Provider-Token-Block $pteroprotect_provider_token_block;
    proxy_set_header X-PteroProtect-Has-Token $pteroprotect_req_has_any_token;
    proxy_set_header X-PteroProtect-Original-URI $request_uri;
    proxy_set_header X-PteroProtect-Original-Method $request_method;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @pteroprotect_challenge_deny;
    proxy_connect_timeout 300ms;
    proxy_send_timeout 1s;
    proxy_read_timeout 1s;
}

location = /__pteroprotect/challenge/check_web {
    internal;
    proxy_pass http://$pteroprotect_challenge_upstream/check-web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-PteroProtect-Internal 1;
    proxy_set_header X-PteroProtect-Original-URI $request_uri;
    proxy_set_header X-PteroProtect-Original-Method $request_method;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @pteroprotect_challenge_deny;
    proxy_connect_timeout 300ms;
    proxy_send_timeout 1s;
    proxy_read_timeout 1s;
}

# Internal challenge/token decision endpoint for Wings/WebSocket traffic.
location = /__pteroprotect/challenge/check_token {
    internal;
    proxy_pass http://$pteroprotect_challenge_upstream/check-token;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-PteroProtect-Internal 1;
    proxy_set_header X-PteroProtect-Provider-Token-Block $pteroprotect_provider_token_block;
    proxy_set_header X-PteroProtect-Has-Token $pteroprotect_req_has_any_token;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @pteroprotect_challenge_deny;
    proxy_connect_timeout 300ms;
    proxy_send_timeout 1s;
    proxy_read_timeout 1s;
}

location = /__pteroprotect/challenge/check_provider_api {
    internal;
    proxy_pass http://$pteroprotect_challenge_upstream/check-provider-api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-PteroProtect-Internal 1;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @pteroprotect_challenge_deny;
    proxy_connect_timeout 300ms;
    proxy_send_timeout 1s;
    proxy_read_timeout 1s;
}

# Public challenge endpoints.
location = /__pteroprotect/challenge {
    proxy_pass http://$pteroprotect_challenge_upstream/page;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;
    proxy_connect_timeout 500ms;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
}

location = /__pteroprotect/challenge/page {
    proxy_pass http://$pteroprotect_challenge_upstream/page;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;
    proxy_connect_timeout 500ms;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
}

location = /__pteroprotect/challenge/sw.js {
    proxy_pass http://$pteroprotect_challenge_upstream/sw.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;
    proxy_connect_timeout 500ms;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
}

location = /__pteroprotect/challenge/new {
    # Challenge issue endpoint can be abused for token farming.
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_auth_global_conn 60;
    limit_req zone=pteroprotect_auth_global_req burst=60 nodelay;
    proxy_pass http://$pteroprotect_challenge_upstream/new;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;
    proxy_connect_timeout 500ms;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
}

location = /__pteroprotect/challenge/click {
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_auth_global_conn 80;
    limit_req zone=pteroprotect_auth_global_req burst=90 nodelay;
    proxy_pass http://$pteroprotect_challenge_upstream/click;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;
    proxy_connect_timeout 500ms;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
}

location = /__pteroprotect/challenge/verify-math {
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_auth_global_conn 80;
    limit_req zone=pteroprotect_auth_global_req burst=90 nodelay;
    proxy_pass http://$pteroprotect_challenge_upstream/verify-math;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;
    proxy_connect_timeout 500ms;
