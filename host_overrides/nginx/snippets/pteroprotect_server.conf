}

location = /__pteroprotect/challenge/solve {
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_auth_global_conn 80;
    limit_req zone=pteroprotect_auth_global_req burst=90 nodelay;
    proxy_pass http://$pteroprotect_challenge_upstream/solve;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;
    proxy_connect_timeout 500ms;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
}

# Keep interactive auth routes responsive even under noisy traffic.
location = /auth/login {
    limit_conn pteroprotect_conn 20;
    limit_req zone=pteroprotect_auth burst=20;
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /auth/ {
    limit_conn pteroprotect_conn 20;
    limit_req zone=pteroprotect_auth burst=20;
    try_files $uri $uri/ /index.php?$query_string;
}

location = /sanctum/csrf-cookie {
    limit_conn pteroprotect_conn 20;
    limit_conn pteroprotect_auth_global_conn 100;
    limit_req zone=pteroprotect_auth_global_req burst=90 nodelay;
    limit_req zone=pteroprotect_auth burst=60 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location ~* ^/admin/protect/terminal/sessions/[A-Za-z0-9_-]+/ws$ {
    if ($request_method != GET) { return 405; }
    if ($http_upgrade !~* "^websocket$") { return 426; }
    modsecurity off;
    limit_conn pteroprotect_conn 4;
    limit_req zone=pteroprotect_auth burst=8 nodelay;
    proxy_pass http://127.0.0.1:18445;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location ~* ^/api/client/servers/[^/]+/websocket$ {
    if (-f /dev/shm/pteroprotect/brownout.flag) { return 503; }
    auth_request /__pteroprotect/challenge/check_provider_api;
    error_page 401 = @pteroprotect_provider_token_required;
    # Panel websocket metadata endpoint: rate-limit only (keep SPA flow stable).
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_conn 80;
    limit_conn pteroprotect_ws_global_conn 2000;
    limit_req zone=pteroprotect_ws_req burst=240 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location ~* ^/api/client/servers/[^/]+/(resources|activity)$ {
    if (-f /dev/shm/pteroprotect/brownout.flag) { return 503; }
    auth_request /__pteroprotect/challenge/check_provider_api;
    error_page 401 = @pteroprotect_provider_token_required;
    # Dashboard polling can spike when many servers or tabs exist.
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_api_key_conn 1200;
    limit_conn pteroprotect_api_global_conn 5000;
    limit_req zone=pteroprotect_api_key_req burst=6000 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=5200 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location ~* ^/api/client/(?:waf|danexc)/(?:stats|timeline|threats|config|overview|feed)$ {
    auth_request /__pteroprotect/challenge/check_web;
    error_page 401 = @pteroprotect_challenge_redirect;
    error_page 403 = @pteroprotect_provider_web_block;
    if (-f /dev/shm/pteroprotect/brownout.flag) { return 429; }
    # Security dashboard telemetry polling gets a dedicated high-RPS lane.
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_api_key_conn 1000;
    limit_conn pteroprotect_api_global_conn 4200;
    limit_req zone=pteroprotect_api_key_req burst=5200 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=4600 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /api/remote/ {
    # Wings/remote API: keep reachable for node<->panel machine auth.
    # Provider token gate is skipped here; Laravel remote auth still applies.
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_api_key_conn 300;
    limit_conn pteroprotect_api_global_conn 1600;
    limit_req zone=pteroprotect_api_key_req burst=900;
    limit_req zone=pteroprotect_api_global_req burst=1200;
    try_files $uri $uri/ /index.php?$query_string;
}

location = /api/client/account/profile {
    # Browser-auth profile saves rely on Laravel session + CSRF; provider web gate can false-positive here.
    modsecurity off;
    if (-f /dev/shm/pteroprotect/brownout.flag) { return 429; }
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_api_key_conn 60;
    limit_conn pteroprotect_api_global_conn 300;
    limit_req zone=pteroprotect_api_key_req burst=90 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=120 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location = /api/client/account/profile/avatar {
    # Avatar uploads use session cookies and multipart bodies; keep Laravel auth in charge.
    modsecurity off;
    if (-f /dev/shm/pteroprotect/brownout.flag) { return 429; }
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_api_key_conn 40;
    limit_conn pteroprotect_api_global_conn 200;
    limit_req zone=pteroprotect_api_key_req burst=40 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=60 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location /api/client/ {
    auth_request /__pteroprotect/challenge/check_web;
    error_page 401 = @pteroprotect_challenge_redirect;
    error_page 403 = @pteroprotect_provider_web_block;
    if (-f /dev/shm/pteroprotect/brownout.flag) { return 429; }
    # API client path: tighter anti-bot limits, still safe for normal panel usage.
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_api_key_conn 180;
    limit_conn pteroprotect_api_global_conn 900;
    limit_req zone=pteroprotect_api_key_req burst=300 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=260 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location = /api/client {
    auth_request /__pteroprotect/challenge/check_web;
    error_page 401 = @pteroprotect_challenge_redirect;
    error_page 403 = @pteroprotect_provider_web_block;
    if (-f /dev/shm/pteroprotect/brownout.flag) { return 429; }
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_api_key_conn 180;
    limit_conn pteroprotect_api_global_conn 900;
    limit_req zone=pteroprotect_api_key_req burst=300 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=260 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /api/client/chat/ {
    auth_request /__pteroprotect/challenge/check_provider_api;
    error_page 401 = @pteroprotect_provider_token_required;
    if (-f /dev/shm/pteroprotect/brownout.flag) { return 503; }
    # Chat/call endpoints are high-frequency and easy spam targets.
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_api_key_conn 900;
    limit_conn pteroprotect_api_global_conn 3600;
    limit_req zone=pteroprotect_api_key_req burst=3600 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=3200 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

# Wings installer fetches server config from application API using node token.
# Keep this endpoint reachable without provider-token gate to avoid HTTP 461
# loops while preserving rate limits and normal Laravel auth checks.
location ~* ^/api/application/servers/[^/]+/configuration$ {
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_api_key_conn 1200;
    limit_conn pteroprotect_api_global_conn 6000;
    try_files $uri $uri/ /index.php?$query_string;
}

location /api/application/ {
    # Admin/application API path: Laravel API-key auth is the primary guard.
    # Do not put small nginx global buckets here; automation bursts can create
    # valid server/egg/allocation workflows and nginx 429 returns non-JSON.
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pteroprotect_api_key_conn 1200;
    limit_conn pteroprotect_api_global_conn 6000;
    try_files $uri $uri/ /index.php?$query_string;
}

location /api/ {
    # Generic API path fallback.
    auth_request /__pteroprotect/challenge/check_provider_api;
    error_page 401 = @pteroprotect_provider_token_required;
    limit_req_status 444;
    limit_conn_status 444;
    limit_conn pteroprotect_api_key_conn 140;
    limit_conn pteroprotect_api_global_conn 600;
    limit_req zone=pteroprotect_api_key_req burst=180 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=140 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location @challenge_fallback {
    limit_req zone=pp_req_burst burst=20 nodelay;
    try_files $uri $uri/ =200;
}
