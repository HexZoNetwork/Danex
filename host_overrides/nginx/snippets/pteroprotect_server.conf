# PteroProtect host-level HTTP hardening + offline challenge gate.
limit_conn_status 429;
limit_req_status 429;

client_header_timeout 5s;
keepalive_timeout 10s;
keepalive_requests 100;
send_timeout 15s;
reset_timedout_connection on;
client_body_buffer_size 128k;
large_client_header_buffers 4 16k;
etag on;

# Local CDN static cache lane (safe for immutable/static assets only).
location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri $uri/ /index.php?$query_string;
}

# Allow favicon manifest assets without challenge redirect, so browsers can parse them.
location ^~ /favicons/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# Public user-upload assets (avatars, etc.) must bypass challenge; filenames can be extensionless.
location ^~ /storage/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

if ($pteroprotect_sqli_probe) {
    return 403;
}

access_log /var/log/nginx/pteroprotect.sqli.log combined if=$pteroprotect_sqli_probe;

location @pteroprotect_challenge_redirect {
    return 302 /__pteroprotect/challenge?rd=$uri;
}

# Internal challenge decision endpoint (fail-closed by design).
location = /__pteroprotect/challenge/check {
    internal;
    proxy_pass http://127.0.0.1:18444/check;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-PteroProtect-Internal 1;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
    proxy_connect_timeout 300ms;
    proxy_send_timeout 1s;
    proxy_read_timeout 1s;
}

# Internal challenge/token decision endpoint for Wings/WebSocket traffic.
location = /__pteroprotect/challenge/check_token {
    internal;
    proxy_pass http://127.0.0.1:18444/check-token;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-PteroProtect-Internal 1;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
    proxy_connect_timeout 300ms;
    proxy_send_timeout 1s;
    proxy_read_timeout 1s;
}

# Public challenge endpoints.
location = /__pteroprotect/challenge {
    proxy_pass http://127.0.0.1:18444/page;
