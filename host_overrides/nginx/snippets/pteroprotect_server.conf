location = /__pteroprotect/challenge/solve {
    limit_req_status 461;
    limit_conn_status 461;
    limit_conn pteroprotect_auth_global_conn 80;
    limit_req zone=pteroprotect_auth_global_req burst=30 nodelay;
    proxy_pass http://127.0.0.1:18444/solve;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header User-Agent $http_user_agent;
    proxy_connect_timeout 500ms;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
}

# Keep interactive auth routes responsive even under noisy traffic.
location = /auth/login {
    auth_request /__pteroprotect/challenge/check;
    error_page 401 = @pteroprotect_challenge_redirect;
    limit_conn pteroprotect_conn 20;
    limit_req zone=pteroprotect_auth burst=20;
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /auth/ {
    auth_request /__pteroprotect/challenge/check;
    error_page 401 = @pteroprotect_challenge_redirect;
    limit_conn pteroprotect_conn 20;
    limit_req zone=pteroprotect_auth burst=20;
    try_files $uri $uri/ /index.php?$query_string;
}

location = /sanctum/csrf-cookie {
    auth_request /__pteroprotect/challenge/check;
    error_page 401 = @pteroprotect_challenge_redirect;
    limit_conn pteroprotect_conn 20;
    limit_conn pteroprotect_auth_global_conn 100;
    limit_req zone=pteroprotect_auth_global_req burst=30 nodelay;
    limit_req zone=pteroprotect_auth burst=20 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location ~* ^/api/client/servers/[^/]+/websocket$ {
    if (-f /dev/shm/pteroprotect/brownout.flag) { return 503; }
    # Panel websocket metadata endpoint: rate-limit only (keep SPA flow stable).
    limit_req_status 444;
    limit_conn_status 444;
    limit_conn pteroprotect_conn 80;
    limit_conn pteroprotect_ws_global_conn 2000;
    limit_req zone=pteroprotect_ws_req burst=240 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location ~* ^/api/client/servers/[^/]+/resources$ {
    if (-f /dev/shm/pteroprotect/brownout.flag) { return 503; }
    # Dashboard resource polling can spike when many servers exist.
    limit_req_status 444;
    limit_conn_status 444;
    limit_conn pteroprotect_api_key_conn 320;
    limit_conn pteroprotect_api_global_conn 1400;
    limit_req zone=pteroprotect_api_key_req burst=1200 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=1000 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /api/remote/ {
    # Wings/remote API: challenge gate with token bypass + global guard.
    limit_req_status 444;
    limit_conn_status 444;
    limit_conn pteroprotect_api_key_conn 300;
    limit_conn pteroprotect_api_global_conn 1600;
    limit_req zone=pteroprotect_api_key_req burst=900;
    limit_req zone=pteroprotect_api_global_req burst=1200;
    try_files $uri $uri/ /index.php?$query_string;
}

location /api/client/ {
    if (-f /dev/shm/pteroprotect/brownout.flag) { return 429; }
    # API client path: tighter anti-bot limits, still safe for normal panel usage.
    limit_req_status 444;
    limit_conn_status 444;
    limit_conn pteroprotect_api_key_conn 180;
    limit_conn pteroprotect_api_global_conn 900;
    limit_req zone=pteroprotect_api_key_req burst=300 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=260 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location = /api/client {
    if (-f /dev/shm/pteroprotect/brownout.flag) { return 429; }
    limit_req_status 444;
    limit_conn_status 444;
    limit_conn pteroprotect_api_key_conn 180;
    limit_conn pteroprotect_api_global_conn 900;
    limit_req zone=pteroprotect_api_key_req burst=300 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=260 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /api/client/chat/ {
    if (-f /dev/shm/pteroprotect/brownout.flag) { return 503; }
    # Chat/call endpoints are high-frequency and easy spam targets.
    limit_req_status 444;
    limit_conn_status 444;
    limit_conn pteroprotect_api_key_conn 120;
    limit_conn pteroprotect_api_global_conn 500;
    limit_req zone=pteroprotect_api_key_req burst=180 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=140 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location /api/application/ {
    # Admin/application API path: strict but allows automation with valid API keys.
    limit_req_status 444;
    limit_conn_status 444;
    limit_conn pteroprotect_api_key_conn 160;
    limit_conn pteroprotect_api_global_conn 700;
    limit_req zone=pteroprotect_api_key_req burst=220 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=180 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location /api/ {
    # Generic API path fallback.
    limit_req_status 444;
    limit_conn_status 444;
    limit_conn pteroprotect_api_key_conn 140;
    limit_conn pteroprotect_api_global_conn 600;
    limit_req zone=pteroprotect_api_key_req burst=180 nodelay;
    limit_req zone=pteroprotect_api_global_req burst=140 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}
