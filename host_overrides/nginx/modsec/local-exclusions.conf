# Local exclusions for known false positives.
# Add expiration for each exception to force periodic review.
# expires: 2026-12-31

# Pterodactyl API JSON often contains server names, startup commands, env
# values, and log fragments. Keep CRS active but avoid applying SQLi/RCE rules
# to known high-noise JSON fields on authenticated API routes.
SecRule REQUEST_URI "@rx ^/api/(client|application)(/|$)" \
  "id:100100,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS_NAMES,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:description,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:startup,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS:startup,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS:environment,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS:command"

# Challenge solve/check traffic is validated by challenge_guard and includes
# proof hashes, pointer traces, and behavioral arrays that should not burn CRS
# CPU or create false positives.
SecRule REQUEST_URI "@rx ^/__pteroprotect/challenge/(solve|click|verify-math)$" \
  "id:100101,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON,\
  ctl:ruleRemoveByTag=attack-sqli,\
  ctl:ruleRemoveByTag=attack-rce,\
  ctl:ruleRemoveById=920420"

# Break-glass terminal control traffic must be protected by Laravel auth, CSRF,
# origin checks, and one-time tickets. Do not let terminal byte streams trip CRS.
SecRule REQUEST_URI "@rx ^/admin/protect/terminal(/|$)" \
  "id:100102,phase:1,pass,nolog,\
  ctl:ruleRemoveByTag=attack-sqli,\
  ctl:ruleRemoveByTag=attack-rce,\
  ctl:ruleRemoveById=920420"
