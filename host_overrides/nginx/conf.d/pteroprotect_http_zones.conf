# Endpoint-class request and connection zones.
# Values may be templated by setup.sh from config.json.
limit_req_zone $binary_remote_addr zone=pteroprotect_req:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=pteroprotect_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=pteroprotect_ws_req:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=pteroprotect_conn:20m;

limit_req_zone $server_name zone=pteroprotect_global_req:10m rate=300r/s;
limit_req_zone $server_name zone=pteroprotect_api_global_req:10m rate=600r/s;
limit_req_zone $server_name zone=pteroprotect_auth_global_req:10m rate=80r/s;
limit_conn_zone $server_name zone=pteroprotect_global_conn:10m;
limit_conn_zone $server_name zone=pteroprotect_api_global_conn:10m;
limit_conn_zone $server_name zone=pteroprotect_auth_global_conn:10m;
limit_conn_zone $server_name zone=pteroprotect_ws_global_conn:10m;

map $http_authorization $pteroprotect_api_key {
    default $binary_remote_addr;
    "~^Bearer[[:space:]]+.+$" "$binary_remote_addr|$http_authorization";
}

limit_req_zone $pteroprotect_api_key zone=pteroprotect_api_key_req:20m rate=400r/s;
limit_conn_zone $pteroprotect_api_key zone=pteroprotect_api_key_conn:20m;

map "$request_uri|$args" $pteroprotect_sqli_probe {
    default 0;
    ~*(union(\+|%20|[[:space:]])+select) 1;
    ~*(select(\+|%20|[[:space:]]).+from) 1;
    ~*(information_schema|concat\(|sleep\(|benchmark\(|load_file\(|extractvalue\(|updatexml\() 1;
    ~*(into(\+|%20|[[:space:]])+outfile) 1;
    ~*((%27|')\s*or\s*(%27|')?1(%27|')?=(%27|')?1) 1;
    ~*(order(\+|%20|[[:space:]])+by(\+|%20|[[:space:]])+[0-9]+) 1;
}

# TLS and HTTP/2 resource pressure controls.
ssl_session_cache shared:pteroprotect_ssl:20m;
ssl_session_timeout 10m;
ssl_session_tickets off;
ssl_early_data off;
http2_max_concurrent_streams 64;
