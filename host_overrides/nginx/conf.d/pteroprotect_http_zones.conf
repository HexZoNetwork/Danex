# PteroProtect Hardened Rate Limit Zones
map $request_uri $pteroprotect_fastcgi_request_uri {
    default $request_uri;
    ~^//+api/(application|client|remote)(/[^?]*)?(\?.*)?$ /api/$1$2$3;
}

# Use geo to mask IPv6 to /64 for fair rate limiting
geo $pteroprotect_rate_key {
    default $binary_remote_addr;
}

# Connection zones used by pteroprotect_server.conf.
limit_conn_zone $pteroprotect_rate_key zone=pteroprotect_conn:32m;
limit_conn_zone $pteroprotect_rate_key zone=pteroprotect_auth_global_conn:16m;
limit_conn_zone $pteroprotect_rate_key zone=pteroprotect_ws_global_conn:16m;
limit_conn_zone $pteroprotect_rate_key zone=pteroprotect_api_key_conn:32m;
limit_conn_zone $server_name zone=pteroprotect_api_global_conn:16m;

# Request rate zones used by pteroprotect_server.conf.
limit_req_zone $pteroprotect_rate_key zone=pteroprotect_auth:16m rate=10r/s;
limit_req_zone $pteroprotect_rate_key zone=pteroprotect_req:32m rate=30r/s;
limit_req_zone $pteroprotect_rate_key zone=pteroprotect_auth_global_req:16m rate=20r/s;
limit_req_zone $pteroprotect_rate_key zone=pteroprotect_ws_req:16m rate=40r/s;
limit_req_zone $pteroprotect_rate_key zone=pteroprotect_api_key_req:32m rate=120r/s;
limit_req_zone $server_name zone=pteroprotect_api_global_req:16m rate=600r/s;
limit_req_zone $pteroprotect_rate_key zone=pp_req_burst:32m rate=60r/s;
limit_req_zone $pteroprotect_rate_key zone=pteroprotect_uno:16m rate=12r/s;
limit_req_zone $pteroprotect_rate_key zone=pteroprotect_uno_poll:16m rate=20r/s;

limit_conn_status 429;
limit_req_status 429;
