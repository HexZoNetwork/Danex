# PteroProtect Hardened Rate Limit Zones
# Use geo to mask IPv6 to /64 for fair rate limiting
geo $pteroprotect_rate_key {
    default $binary_remote_addr;
}

# Connection zones used by pteroprotect_server.conf.
limit_conn_zone $pteroprotect_rate_key zone=pteroprotect_conn:32m;
limit_conn_zone $pteroprotect_rate_key zone=pteroprotect_auth_global_conn:16m;
limit_conn_zone $pteroprotect_rate_key zone=pteroprotect_ws_global_conn:16m;
limit_conn_zone $pteroprotect_rate_key zone=pteroprotect_api_key_conn:32m;
limit_conn_zone $server_name zone=pteroprotect_api_global_conn:16m;

# Request rate zones used by pteroprotect_server.conf.
limit_req_zone $pteroprotect_rate_key zone=pteroprotect_auth:16m rate=64r/s;
limit_req_zone $pteroprotect_rate_key zone=pteroprotect_req:32m rate=90r/s;
limit_req_zone $pteroprotect_rate_key zone=pteroprotect_auth_global_req:16m rate=64r/s;
limit_req_zone $pteroprotect_rate_key zone=pteroprotect_ws_req:16m rate=80r/s;
limit_req_zone $pteroprotect_rate_key zone=pteroprotect_api_key_req:32m rate=600r/s;
limit_req_zone $server_name zone=pteroprotect_api_global_req:16m rate=1800r/s;
limit_req_zone $pteroprotect_rate_key zone=pp_req_burst:32m rate=120r/s;

limit_conn_status 429;
limit_req_status 429;
